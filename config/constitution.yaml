
rules:
  - rule_id: DP-001
    risk_category: data_privacy
    action: block
    description: "Explicit request to expose another person's PII without consent"
    keywords:
      - "social security number"
      - "ssn:"
      - "credit card number"
      - "someone's password"
      - "without their consent"
      - "without her knowing"
      - "without him knowing"
      - "without them knowing"
      - "without their knowledge"

  - rule_id: DP-002
    risk_category: data_privacy
    action: flag
    description: "Touches personal data handling, may need review"
    keywords:
      - "personal data"
      - "home address"
      - "medical record"

  - rule_id: DC-001
    risk_category: dangerous_content
    action: block
    description: "Instructions to cause physical harm or build weapons"
    keywords:
      - "how to make a bomb"
      - "synthesize a nerve agent"
      - "build an explosive"
      - "untraceable poison"
      - "build a pipe bomb"
      - "make a pipe bomb"
      - "pipe bomb instructions"
      - "make a bomb"
      - "build a bomb"
      - "make a nerve agent"
      - "make nerve agent"

  - rule_id: DC-002
    risk_category: dangerous_content
    action: flag
    description: "Sensitive topic, not clearly an operational request"
    keywords:
      - "weapon"
      - "explosive"
      - "poison"

  - rule_id: HAC-001
    risk_category: human_ai_configuration
    action: require_human
    description: "High-stakes decision affecting a third party"
    keywords:
      - "legal advice"
      - "medical diagnosis"
      - "should i fire"
      - "financial advice for my client"
      - "should i stop taking"
      - "should i start taking"
      - "what dose"
      - "safe dose"
      - "dosage for"
      - "how much ibuprofen"
      - "how much acetaminophen"
      - "how much tylenol"
      - "can i sue"
      - "should i sue"
      - "is this mole"
      - "cancerous"
      - "do i have cancer"

  - rule_id: HAC-002
    risk_category: human_ai_configuration
    action: flag
    description: "Request asks system to bypass confirmation/oversight steps"
    keywords:
      - "don't ask me to confirm"
      - "just do it automatically without checking"
      - "skip the confirmation"
      - "without any safety review"
      - "without a safety review"
      - "no checks"
      - "without confirmation"
